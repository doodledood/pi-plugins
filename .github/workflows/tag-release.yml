name: Tag release on version bump

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare portable Pi test settings
        run: |
          agent_dir="$RUNNER_TEMP/pi-agent"
          mkdir -p "$agent_dir"
          cp setup/settings.example.json "$agent_dir/settings.json"
          echo "PI_CODING_AGENT_DIR=$agent_dir" >> "$GITHUB_ENV"
      - run: npm run verify

  tag-release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Backfill and publish version tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # After the current commit passes the verify job, walk every version
          # commit (oldest first) and reconcile its tag and GitHub release.
          # Missing historical tags are published only after that exact commit
          # independently passes the same clean-install verification.
          git fetch --tags --force
          commits=$(git log --reverse --format='%H' -- package.json)
          prev_version=""
          for commit in $commits; do
            version=$(git show "$commit:package.json" | jq -r '.version // empty')
            if [ -z "$version" ] || [ "$version" = "$prev_version" ]; then
              continue
            fi
            prev_version="$version"
            tag="v$version"

            is_current=false
            tag_exists=false
            release_exists=false
            if [ "$commit" = "$GITHUB_SHA" ]; then is_current=true; fi
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then tag_exists=true; fi
            if gh release view "$tag" >/dev/null 2>&1; then release_exists=true; fi
            plan=$(node scripts/release-plan.mjs "$is_current" "$tag_exists" "$release_exists")

            if [ "$(jq -r '.verifyCandidate' <<<"$plan")" = "true" ]; then
              candidate_dir=$(mktemp -d)
              candidate_agent_dir=$(mktemp -d)
              git worktree add --detach "$candidate_dir" "$commit"
              cp "$candidate_dir/setup/settings.example.json" "$candidate_agent_dir/settings.json"
              if ! (
                cd "$candidate_dir"
                npm ci
                PI_CODING_AGENT_DIR="$candidate_agent_dir" npm run verify
              ); then
                git worktree remove --force "$candidate_dir"
                rm -rf "$candidate_dir" "$candidate_agent_dir"
                echo "::error::Refusing to backfill $tag because $commit failed verification"
                exit 1
              fi
              git worktree remove --force "$candidate_dir"
              rm -rf "$candidate_dir" "$candidate_agent_dir"
            fi

            if [ "$(jq -r '.createTag' <<<"$plan")" = "true" ]; then
              echo "Creating missing tag $tag at $commit"
              git tag -a "$tag" "$commit" -m "$tag"
              git push origin "refs/tags/$tag"
            fi

            if [ "$(jq -r '.createRelease' <<<"$plan")" = "true" ]; then
              gh release create "$tag" --title "$tag" --generate-notes --target "$commit"
            fi
          done
